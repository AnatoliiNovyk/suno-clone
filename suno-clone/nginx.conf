server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing: every unknown path falls back to index.html
    # so React Router handles /create, /admin, etc. on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
