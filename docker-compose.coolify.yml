services:
  api:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:?Set GOOGLE_AI_API_KEY in Coolify}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in Coolify}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in Coolify}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in Coolify}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the public HTTPS origin}
      GENERATION_STUCK_AFTER_SECONDS: ${GENERATION_STUCK_AFTER_SECONDS:-1800}
      GENERATION_REAPER_INTERVAL_SECONDS: ${GENERATION_REAPER_INTERVAL_SECONDS:-300}
      ALLOW_DEGRADED_START: "0"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in Coolify}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set VITE_SUPABASE_ANON_KEY in Coolify}
        VITE_GENERATE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
